name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run typecheck
      - run: docker build -t immich-sorter:test .
      - name: Check container startup
        shell: bash
        run: |
          set -euo pipefail
          docker volume create sorter-test-data
          docker run --detach --name sorter-test --publish 127.0.0.1:3000:3000 \
            --mount source=sorter-test-data,target=/app/data immich-sorter:test
          trap 'docker logs sorter-test; docker rm --force sorter-test; docker volume rm sorter-test-data' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            --max-time 5 --retry-max-time 60 \
            http://localhost:3000/ --output /dev/null
          docker exec sorter-test sh -lc 'test "$(awk "/^Uid:/{print \$2}" /proc/1/status)" = 1000'
          docker exec --user node sorter-test sh -lc 'touch /app/data/.write-test && rm /app/data/.write-test'
      - name: Check Docker Hub configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set the DOCKERHUB_USERNAME repository variable.'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set the DOCKERHUB_TOKEN repository secret.'; exit 1; }
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/$DOCKERHUB_USERNAME/immich-sorter"
          docker tag immich-sorter:test "$image:sha-$GITHUB_SHA"
          docker tag immich-sorter:test "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
